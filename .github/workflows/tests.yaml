name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: npm test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false
      - run: corepack enable
      - run: yarn install --frozen-lockfile
      - run: yarn test
